<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mayar ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            max-width: 380px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.12);
            animation: fadeIn 1.2s ease-in-out;
        }
        .img-container {
            width: 100%;
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }
        h1 {
            color: #fb7185;
            font-size: 22px;
            margin-bottom: 12px;
            font-weight: 700;
        }
        p {
            font-size: 15px;
            line-height: 1.8;
            color: #e2e8f0;
            margin-bottom: 20px;
            font-weight: 400;
        }
        .audio-wrapper {
            background: rgba(15, 23, 42, 0.6);
            padding: 10px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        audio {
            width: 100%;
            outline: none;
            border-radius: 10px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="img-container">
            <img src="photo.jpg" alt="Mayar">
        </div>
        
        <h1>إلى أغلَى ما في الحَياة ❤️</h1>
        
        <p>
            كل ثانية معاكي هي أحلى جزء في حياتي.. وجودك جنبي بيحلّي كل حاجة، وأنتِ دايماً أغلى عندي من أي حاجة في الدنيا. ربنا يخليكي ليا وما يحرمناش من بعض أبدًا.
        </p>
        
        <div class="audio-wrapper">
            <audio controls autoplay loop>
                <source src="https://server8.mp3quran.net/yaqoot.mp3" type="audio/mpeg">
            </audio>
        </div>
    </div>

</body>
</html>
